[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-treasury-yield-timeseries-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "plotly",
    "jupyterlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "requests-mock"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call the real external API"
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["*.ipynb", "notebooks/", "*.md"]

[tool.setuptools]
py-modules = ["logger_config", "extract"]
package-dir = {"" = "src"}
