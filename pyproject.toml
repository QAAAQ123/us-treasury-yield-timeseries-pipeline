[project]
name = "us-treasury-yield-spread-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "plotly",
    "jupyterlab",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"