name: Collect Treasury Data

on:
  schedule:
    # Every day at 20:00 New York time (EST / EDT)
    - cron: "0 20 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write
  actions: write # CSV 변경 시 deploy workflow를 실행하기 위해 필요


jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run incremental pipeline
        run: |
          python -c "from pipeline import run_incremental_pipeline; run_incremental_pipeline()"

      - name: Check CSV changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- data/)" ]]; then
            echo "csv_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "csv_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit CSV changes
        if: steps.changes.outputs.csv_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "data: update Treasury yield data"
          git push

      # GITHUB_TOKEN으로 push한 커밋은 다른 workflow를 트리거하지 않으므로
      # CSV 변경이 정상 커밋된 경우에만 deploy workflow를 직접 실행한다
      - name: Trigger deploy workflow
        if: steps.changes.outputs.csv_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml --ref main
